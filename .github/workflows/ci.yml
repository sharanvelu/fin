name: ci

# Fast checks that gate every change. Runs on every branch push and on PRs into
# master. Does NOT build the binary — that happens on merge to master (see
# release.yml). Make the `test` job a required status check on the master branch
# rule to block merges when tests fail.

on:
  pull_request:
    branches: [master]

# Cancel superseded runs for the same ref (a new push supersedes the old one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fincli + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # The suite is hermetic — it mocks the Docker SDK, so no daemon is needed.
        run: python -m pytest

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install "ruff>=0.15"

      # Advisory only: `continue-on-error` means findings are reported (as GitHub
      # annotations) but never fail the run or block a merge. Flip these to
      # blocking once the codebase is ruff-clean (a dedicated cleanup PR).
      - name: ruff check
        continue-on-error: true
        run: python -m ruff check --output-format=github fincli tests

      - name: ruff format --check
        continue-on-error: true
        run: python -m ruff format --check fincli tests
