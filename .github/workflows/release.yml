name: build & release

# Build the standalone `fin` binary (PyInstaller onedir) for each OS/arch.
# PyInstaller cannot cross-compile, so each artifact is built on its own native
# runner. Tests are NOT run here — they gate the merge via ci.yml + the branch
# rule, so anything reaching master has already passed.
#
# Triggers:
#   - push to master (i.e. a PR merged in) → build + upload workflow artifacts
#     (validates that the release binary still compiles on every merge)
#   - pushing a tag like v0.1.0            → build + attach the tarballs to the Release
#   - manual run (workflow_dispatch)       → build + upload workflow artifacts

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to upload assets to the Release

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,        os: macos, arch: arm64 }
          - { runner: macos-13,        os: macos, arch: x64 }
          - { runner: ubuntu-latest,   os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build + runtime dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Runtime deps must be importable so PyInstaller can bundle them.
          python3 -m pip install pyinstaller typer rich docker

      - name: Build binary + tarball
        run: bash packaging/build.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/fin-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fin-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
