name: build & release

# Build the standalone `fin` binary (PyInstaller onedir) for each OS/arch, then
# publish it. PyInstaller cannot cross-compile, so each artifact is built on its
# own native runner. Tests are NOT run here — ci.yml + the branch rule gate the
# merge, so anything reaching master has already passed.
#
# Publishing:
#   - push to master (a merged PR) → refresh the rolling `latest` prerelease:
#     the `latest` tag is force-moved to this commit and its assets replaced.
#   - push a v* tag                → create an immutable versioned release.
#   - manual dispatch              → build (+ refresh `latest` if run on master).
#
# The tool's own version (`fin --version`) comes from pyproject.toml and is
# independent of these tags; bump it there when cutting a v* release.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create/refresh releases and upload assets

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,        os: macos, arch: arm64 }
          - { runner: ubuntu-latest,   os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build + runtime dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Runtime deps must be importable so PyInstaller can bundle them.
          python3 -m pip install pyinstaller typer rich docker

      - name: Build binary + tarball
        run: bash packaging/build.sh

      - name: Upload build artifact (consumed by the release job)
        uses: actions/upload-artifact@v4
        with:
          name: fin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/fin-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # Rolling prerelease: one job (not per-matrix) so the `latest` tag can be
  # force-moved atomically after all four binaries are built.
  release-latest:
    name: rolling release (latest)
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fin-*
          merge-multiple: true
          path: dist

      - name: Refresh the rolling `latest` release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Delete the old release + tag (ignore if absent), then recreate the
          # tag at THIS commit with the fresh assets — a true rolling pointer.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.tar.gz \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Rolling build from master (\`${GITHUB_SHA}\`). For a pinned, stable build install a v* release instead."

  # Immutable versioned release, cut by pushing a tag like v0.1.0.
  release-tag:
    name: versioned release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fin-*
          merge-multiple: true
          path: dist

      - name: Publish ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --notes "Fin $GITHUB_REF_NAME" \
            --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
