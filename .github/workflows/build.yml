# Build the standalone `fin` binary (PyInstaller onedir) for each OS/arch,
# then publish it. PyInstaller cannot cross-compile, so each artifact is built
# on its own native runner (no QEMU). Tests are NOT run here — the PR gates
# (tests/code-style/static-analysis/build-check) plus the branch ruleset
# guarantee anything reaching master already passed, so each release builds
# exactly once from vetted code.
#
# Runs ONLY at v* tags — one build per release, nothing on ordinary master
# pushes. Each release publishes twice from the same artifacts:
#   1. the immutable vX.Y.Z release
#   2. a refresh of the rolling `latest` prerelease, which is what install.sh
#      downloads by default (its tag is force-moved to the release commit)
#
# Triggers:
#   workflow_dispatch at a v* tag  → how tag.yml cuts releases (see tag.yml for
#                                    why it must dispatch instead of push)
#   push of a v* tag               → same, for manually pushed tags
#   workflow_dispatch with dry_run → build all platforms, publish nothing
#
# The tool's own version (`fin --version`) comes from pyproject.toml; bumping
# it on master is what triggers tag.yml → this workflow.

name: build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build all platforms but publish nothing.
        type: boolean
        default: false

permissions: {}

# Never cancel a release build mid-publish; queue instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, os: macos, arch: arm64 }
          - { runner: ubuntu-latest, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runtime deps must be importable so PyInstaller can bundle them.
      - uses: ./.github/actions/setup
        with:
          extra-packages: pyinstaller

      - name: Build binary + tarball
        run: bash packaging/build.sh

      - name: Smoke-test the binary
        run: dist/fin/fin --help

      - name: Upload build artifact (consumed by the release jobs)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/fin-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # One job (not per-matrix) so both releases are published atomically after
  # ALL binaries built. Guarded on the tag ref so a dry-run dispatch from a
  # branch can never publish.
  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create releases, move the `latest` tag, upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fin-*
          merge-multiple: true
          path: dist

      - name: Publish ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --notes "Fin $GITHUB_REF_NAME" \
            --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber

      - name: Refresh the rolling `latest` release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # install.sh downloads the `latest` prerelease by default. Delete the
          # old release + tag (ignore if absent), then recreate the tag at the
          # commit this release was built from, with the same assets.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.tar.gz \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build ($GITHUB_REF_NAME)" \
            --notes "Rolling pointer to the newest release ($GITHUB_REF_NAME, \`${GITHUB_SHA}\`). Install a v* release for a pinned build."
