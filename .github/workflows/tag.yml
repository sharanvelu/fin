# Cut a versioned release when the version in pyproject.toml changes on master.
#
# Flow: merge a PR that bumps `version = "X.Y.Z"` → this validates strict
# semver and creates tag vX.Y.Z (if it doesn't already exist) → explicitly
# dispatches build.yml at that tag.
#
# The explicit dispatch is LOAD-BEARING: refs created with the workflow's own
# GITHUB_TOKEN never trigger other workflows' `push: tags:` events (GitHub's
# recursion guard) — `workflow_dispatch` via `gh workflow run` is the
# documented exception. The tag is created through the API (gh), so checkout
# never needs persisted credentials.

name: tag

on:
  push:
    branches: [master]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions: {}

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the v* tag ref
      actions: write # dispatch build.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read and validate version
        id: version
        run: |
          VERSION="$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -1)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=pyproject.toml::version '$VERSION' is not strict semver (X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag if it does not exist
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
            echo "Created $TAG at $GITHUB_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch the release build at the tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run build.yml --ref "v$VERSION"
