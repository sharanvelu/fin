[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-cli"
version = "0.1.0"
description = "Fin — a fast, opinionated, plugin-driven CLI for running local development containers (Laravel, PHP, Python and more)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fin" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
fin = "fincli.__main__:main"

[tool.setuptools.packages.find]
include = ["fincli*"]
exclude = ["plugs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
