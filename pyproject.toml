[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-cli"
version = "0.1.3"
description = "Fin — a fast, opinionated, plugin-driven CLI for running local development containers (Laravel, PHP, Python and more)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fin" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    # QA tools are pinned EXACTLY: their rules/output define the CI gates, so a
    # floating release must never break unrelated PRs (ruff 0.16 changed the
    # default lint rules and did exactly that). Dependabot bumps these weekly.
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[project.scripts]
fin = "fincli.__main__:main"

[tool.setuptools.packages.find]
include = ["fincli*"]
exclude = ["plugs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit selection so the gate never depends on ruff's floating defaults
# (which changed in 0.16). This is the classic default set: pyflakes plus
# pycodestyle errors. Extend deliberately, in a dedicated PR that fixes the
# violations it introduces.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
packages = ["fincli"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The docker SDK ships no type stubs; don't fail on its imports.
module = "docker.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["fincli"]

[tool.coverage.report]
# Coverage ratchet: CI fails below this floor (see .github/workflows/tests.yml).
# When coverage grows, raise the floor — never lower it.
fail_under = 88
show_missing = true
